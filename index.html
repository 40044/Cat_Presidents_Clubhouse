<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Presidents Clubhouse</title>
    <style>
        /* Grundlegendes Design */
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 20px;
            padding: 0;
        }

        h1, h2 {
            color: #ff69b4;
        }

        /* Styling für die einzelnen Bereiche */
        .section-box {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .filter-label {
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }

        .checkbox-group {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        /* Styling für die Song-Einträge */
        .plan-entry {
            background-color: #333333;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        audio {
            margin-top: 8px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <h1>🐱 Cat Presidents Clubhouse</h1>

    <!-- 1. CHAT BEREICH -->
    <div class="section-box" id="chat-section">
        <h2>💬 Club Chat</h2>
        <div id="chat-messages" style="min-height: 100px; background: #111; padding: 10px; border-radius: 5px; margin-bottom: 10px;">
            <p style="opacity: 0.6;">Willkommen im Chat!</p>
        </div>
        <input type="text" id="chat-input" placeholder="Nachricht schreiben..." style="width: 70%; padding: 8px;">
        <button style="padding: 8px 15px; background: #ff69b4; border: none; color: white; border-radius: 4px; cursor: pointer;">Senden</button>
    </div>

    <!-- 2. SSO-CODE BEREICH -->
    <div class="section-box" id="sso-section">
        <h2>🔑 Aktueller SSO-Code</h2>
        <p>Code: <strong style="color: #00ffcc;">CATPRESIDENTS2026</strong></p>
    </div>

    <!-- 3. CHAMPI-BAROMETER -->
    <div class="section-box" id="champi-section">
        <h2>🏆 Champi-Barometer</h2>
        <p>Nächstes Championat: <span style="color: #ffcc00;">19:00 Uhr</span></p>
    </div>

    <!-- 4. JUKEBOX MIT BAND-FILTER -->
    <div class="section-box" id="jukebox-section">
        <h2>🎵 Jukebox</h2>
        
        <!-- Filter-Checkboxes -->
        <div style="margin-bottom: 15px;">
            <span class="filter-label">🎸 Bands auswählen:</span>
            <label class="checkbox-group">
                <input type="checkbox" id="chk-bpp" onchange="onFilterChange()"> 
                <span>Baby Pink Panda (Punk)</span>
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="chk-js" onchange="onFilterChange()"> 
                <span>Jorvik Sisters (Pop)</span>
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="chk-vbis" onchange="onFilterChange()"> 
                <span>Vier Brüder im Staub (Dark Country Metal)</span>
            </label>
        </div>

        <!-- Container für Playlist -->
        <div id="jukebox-playlist"></div>
    </div>

    <script>
        // ==========================================
        // 1. SONG-DATENBANK
        // ==========================================
        const songListe = [
            { titel: "Das wilde Banjo", datei: "Das_wilde_Banjo.mp3", band: "vbis" }
            { titel: "Keine Fahnen", datei: "Keine_Fahnen.mp3", band: "js" },
            { titel: "Illegale Rennen", datei: "Illegale_Rennen.mp3", band: "bpp" },
            { titel: "Zaunrennen", datei: "Zaunrennen.mp3", band: "js" },
            { titel: "Slalomrennen", datei: "Slalomrennen.mp3", band: "js" },
            { titel: "Happy Birthday", datei: "Happy_Birthday.mp3", band: "js" },
            { titel: "Der Frieden kommt", datei: "Der_Frieden_kommt.mp3", band: "js" },
            { titel: "Cat President", datei: "Cat_President.mp3", band: "bpp" },
            { titel: "Drachenhexe", datei: "Drachenhexe.mp3", band: "bpp" },
            { titel: "Keine Geschenke", datei: "Keine_Geschenke.mp3", band: "bpp" },
            { titel: "Lieber Lautt 2", datei: "Lieber_Lautt-2.mp3", band: "bpp" },
            { titel: "Märchengast", datei: "Märchengast.mp3", band: "bpp" },
            { titel: "Verstecktes Dorf", datei: "Verstecktes_Dorf.mp3", band: "bpp" },
            { titel: "Wind in den Haaren", datei: "Wind-in_den_Haaren.mp3", band: "bpp" },
            { titel: "Wo sind die Wölfe", datei: "Wo_sind_die_Wölfe.mp3", band: "bpp" },
            { titel: "Zirkus von Pandoria", datei: "Zirkus_von_Pandoria.mp3", band: "bpp" },
            
        ];

        // ==========================================
        // 2. FILTER-ZUSTAND SPEICHERN & LADEN
        // ==========================================
        function saveFilterState() {
            const bppChecked = document.getElementById('chk-bpp').checked;
            const jsChecked = document.getElementById('chk-js').checked;
            const vbisChecked = document.getElementById('chk-vbis').checked;
            
            localStorage.setItem('filter_bpp', bppChecked);
            localStorage.setItem('filter_js', jsChecked);
            localStorage.setItem('filter_vbis', vbisChecked);
        }

        function loadFilterState() {
            const savedBpp = localStorage.getItem('filter_bpp');
            const savedJs = localStorage.getItem('filter_js');
            const savedVbis = localStorage.getItem('filter_vbis');

            // Standardwerte beim allerersten Aufruf:
            // BPP = an (true), JS = an (true), VBIS = aus (false)
            document.getElementById('chk-bpp').checked = (savedBpp === null) ? true : (savedBpp === 'true');
            document.getElementById('chk-js').checked = (savedJs === null) ? true : (savedJs === 'true');
            document.getElementById('chk-vbis').checked = (savedVbis === null) ? false : (savedVbis === 'true');
        }

        function onFilterChange() {
            saveFilterState();
            renderJukebox();
        }

        // ==========================================
        // 3. PLAYLIST RENDERN (ANZEIGEN)
        // ==========================================
        function renderJukebox() {
            const container = document.getElementById('jukebox-playlist');
            const showBpp = document.getElementById('chk-bpp').checked;
            const showJs = document.getElementById('chk-js').checked;
            const showVbis = document.getElementById('chk-vbis').checked;

            let html = '';
            
            const gefilterteSongs = songListe.filter(song => {
                if (song.band === 'bpp' && showBpp) return true;
                if (song.band === 'js' && showJs) return true;
                if (song.band === 'vbis' && showVbis) return true;
                return false;
            });

            if (gefilterteSongs.length === 0) {
                html = '<p style="opacity: 0.6; padding: 10px;">Keine Band ausgewählt. Bitte aktiviere mindestens ein Kästchen.</p>';
            } else {
                gefilterteSongs.forEach(song => {
                    const saubererPfad = encodeURI(song.datei);
                    
                    let bandLabel = '';
                    if (song.band === 'bpp') bandLabel = 'Baby Pink Panda';
                    else if (song.band === 'js') bandLabel = 'Jorvik Sisters';
                    else if (song.band === 'vbis') bandLabel = 'Vier Brüder im Staub';

                    html += `
                        <div class="plan-entry">
                            <strong>🐱 ${song.titel} <span style="font-size:0.8em; opacity:0.7;">(${bandLabel})</span></strong>
                            <audio controls preload="none">
                                <source src="${saubererPfad}" type="audio/mpeg">
                            </audio>
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html;
            setupJukebox();
        }

        // Stoppt andere Audios, wenn ein neuer Song gestartet wird
        function setupJukebox() {
            const audios = document.querySelectorAll('audio');
            audios.forEach(audio => {
                audio.addEventListener('play', () => {
                    audios.forEach(otherAudio => {
                        if (otherAudio !== audio) {
                            otherAudio.pause();
                        }
                    });
                });
            });
        }

        // ==========================================
        // 4. INITIALISIERUNG
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            loadFilterState();
            renderJukebox();
        });
    </script>
</body>
</html>
