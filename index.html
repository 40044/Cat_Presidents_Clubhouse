<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Presidents Clubhouse 🐱</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a2634; color: #e0e0e0; margin: 0; padding: 20px; display: block; }
        .header { text-align: center; padding: 20px 0; }
        .logo-text { color: #ff85a2; font-size: 2.5em; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        
        .main-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; max-width: 1400px; margin: 0 auto; }
        .column { background: #253341; padding: 20px; border-radius: 20px; border: 3px solid #ff85a2; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        
        /* Drei Spalten nebeneinander */
        .left-col { flex: 1.2; min-width: 300px; }
        .center-col { flex: 1.5; min-width: 350px; } 
        .right-col { flex: 1; min-width: 300px; }  
        
        .full-width { width: 100%; max-width: 1400px; margin: 20px auto 0 auto; box-sizing: border-box; }

        .status-box { background: #3d3d29; padding: 20px; border-radius: 15px; border: 2px dashed #fbc02d; text-align: center; position: relative; }
        .plan-entry { background: #2d3d4d; padding: 10px; margin-bottom: 8px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #8bc34a; }
        .time-tag { background: #ff85a2; color: white; padding: 3px 8px; border-radius: 5px; font-weight: bold; font-size: 0.9em; }
        h3 { color: #ff85a2; border-bottom: 1px solid #3d4d5d; padding-bottom: 5px; margin-top: 0; }
        #sound-status { font-size: 0.9em; padding: 5px; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        .sound-off { background: #ff5252; color: white; animation: blinker 1.5s linear infinite; cursor: pointer; }
        .sound-on { background: #4caf50; color: white; }
        @keyframes blinker { 50% { opacity: 0.3; } }
        
        audio { width: 100%; margin-top: 5px; }

        /* Filter-Styling */
        .filter-container { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; background: #1a2634; padding: 10px 15px; border-radius: 10px; align-items: center; }
        .filter-label { font-weight: bold; color: #ff85a2; }
        .checkbox-group { display: flex; align-items: center; gap: 5px; cursor: pointer; }

        /* Gallery Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 15px; max-height: 550px; overflow-y: auto; padding-right: 5px; }
        .cat-gallery-item { position: relative; width: 100%; padding-top: 100%; border-radius: 10px; overflow: hidden; border: 2px solid #ff85a2; background: #1a2634; cursor: pointer; }
        .cat-gallery-item img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease; }
        .cat-gallery-item:hover img { transform: scale(1.08); }

        /* Modal / Fullscreen Navigation */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); justify-content: center; align-items: center; z-index: 9999; }
        .modal img { max-width: 90%; max-height: 85%; border-radius: 15px; border: 3px solid #ff85a2; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; font-weight: bold; }
        .close-btn:hover { color: #ff85a2; }

        .modal-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); font-size: 50px; color: #ffffff; cursor: pointer; user-select: none; padding: 10px 15px; background: rgba(0, 0, 0, 0.4); border-radius: 8px; transition: background 0.2s ease, color 0.2s ease; }
        .modal-nav-btn:hover { color: #ff85a2; background: rgba(0, 0, 0, 0.8); }
        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }
    </style>
</head>
<body onclick="enableAudio()">

    <div class="header">
        <p class="logo-text">🐾 Cat Presidents Clubhouse 🐾</p>
    </div>

    <div class="main-container">
        
        <!-- SPALTE 1: CAT GALLERY (LINKS) -->
        <div class="column left-col">
            <h3>🖼️ Cat Gallery</h3>
            <div id="cat-gallery" class="gallery-grid"></div>
        </div>

        <!-- SPALTE 2: BAROMETER & TAGESPLAN (MITTE) -->
        <div class="column center-col">
            <h3>📊 Champi-Barometer</h3>
            <div class="status-box">
                <p><strong>HEUTE: <span id="heutiger-tag">...</span></strong></p>
                <h2 id="champi-name" style="color: #ff85a2; margin: 10px 0;">Suche...</h2>
                <p>Countdown: <span id="countdown" style="font-weight: bold; color: #fbc02d; font-size: 1.6em;">--:--</span></p>
                <p id="local-time" style="font-size: 0.8em; opacity: 0.6;"></p>
                <div id="sound-status" class="sound-off">⚠️ KLICKEN: MIAU IST NOCH STUMM! ⚠️</div>
            </div>

            <h3 style="margin-top: 25px;">📅 Tagesplan</h3>
            <div id="tages-plan" style="max-height: 300px; overflow-y: auto;"></div>
        </div>

        <!-- SPALTE 3: CHAT (RECHTS) -->
        <div class="column right-col">
            <h3>💬 Chat</h3>
            <script src="https://minnit.chat/js/embed.js?c=1772345192" defer></script>
            <span class="minnit-chat-sembed" data-chatname="https://organizations.minnit.chat/443778136316393/c/Main?embed&&dark=1" data-style="width:100%; height:550px;">Chat</span>
        </div>

    </div>

    <!-- CLUB-JUKEBOX -->
    <div class="column full-width">
        <h3>🎵 Club-Jukebox</h3>
        
        <div class="filter-container">
            <span class="filter-label">🎸 Bands auswählen:</span>
            <label class="checkbox-group">
                <input type="checkbox" id="chk-bpp" onchange="onFilterChange()"> 
                <span>Baby Pink Panda (Punk)</span>
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="chk-js" onchange="onFilterChange()"> 
                <span>Jorvik Sisters (Pop)</span>
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="chk-vbis" onchange="onFilterChange()"> 
                <span>Vier Brüder im Staub (Dark Country Metal)</span>
            </label>
        </div>

        <div id="jukebox-playlist"></div>
    </div>

    <!-- MODAL MIT NAVIGATION -->
    <div class="modal" id="imageModal">
        <span class="close-btn" id="closeBtn">&times;</span>
        <span class="modal-nav-btn prev-btn" id="prevBtn">&#10094;</span>
        <img id="modalImg" src="" alt="Cat Image Preview">
        <span class="modal-nav-btn next-btn" id="nextBtn">&#10095;</span>
    </div>

    <audio id="audio-miau" src="miau.mp3" preload="auto"></audio>
    <audio id="audio-champi" preload="auto"></audio>

    <script>
        let alleTageDaten = {};
        let audioEnabled = false;
        let lastPlayed = ""; 
        const tage = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];

        /* SONG DATENBANK */
        const songListe = [
            { titel: "Keine Fahnen", datei: "Keine_Fahnen.mp3", band: "js" },
            { titel: "Illegale Rennen", datei: "Illegale_Rennen.mp3", band: "bpp" },
            { titel: "Zaunrennen", datei: "Zaunrennen.mp3", band: "js" },
            { titel: "Slalomrennen", datei: "Slalomrennen.mp3", band: "js" },
            { titel: "Happy Birthday", datei: "Happy_Birthday.mp3", band: "js" },
            { titel: "Der Frieden kommt", datei: "Der_Frieden_kommt.mp3", band: "js" },
            { titel: "Cat President", datei: "Cat_President.mp3", band: "bpp" },
            { titel: "Drachenhexe", datei: "Drachenhexe.mp3", band: "bpp" },
            { titel: "Keine Geschenke", datei: "Keine_Geschenke.mp3", band: "bpp" },
            { titel: "Lieber Lautt 2", datei: "Lieber_Lautt-2.mp3", band: "bpp" },
            { titel: "Märchengast", datei: "Märchengast.mp3", band: "bpp" },
            { titel: "Verstecktes Dorf", datei: "Verstecktes_Dorf.mp3", band: "bpp" },
            { titel: "Wind in den Haaren", datei: "Wind-in_den_Haaren.mp3", band: "bpp" },
            { titel: "Wo sind die Wölfe", datei: "Wo_sind_die_Wölfe.mp3", band: "bpp" },
            { titel: "Zirkus von Pandoria", datei: "Zirkus_von_Pandoria.mp3", band: "bpp" },
            { titel: "Das wilde Banjo", datei: "Das_wilde_Banjo.mp3", band: "vbis" }
        ];

        /* GALLERY SYSTEM */
        let aktiverBildIndex = 1;
        const gesamtBilder = 28;
        const folderPath = 'Katzen_Bilder';

        window.onload = function() { init(); };

        async function init() {
            await loadChampiData();
            updateDisplay();
            setInterval(updateDisplay, 1000);

            loadFilterState();
            renderJukebox();
            loadCatGalleryDirect();
        }

        function enableAudio() {
            if(!audioEnabled) {
                audioEnabled = true;
                const status = document.getElementById('sound-status');
                if(status) {
                    status.innerText = "🔊 SOUNDS AKTIV!";
                    status.className = "sound-on";
                }
                document.getElementById('audio-miau').play().then(() => { 
                    document.getElementById('audio-miau').pause(); 
                    document.getElementById('audio-miau').currentTime = 0; 
                }).catch(e => {});
            }
        }

        /* CHAMPIONAT DATEN & COUNTDOWN */
        async function loadChampiData() {
            const spreadsheetId = '1rDCPInp1BjzJ2ced7Pv24ZCi8La6mRCCfFEovNiSEoE';
            const fetchUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv`;
            try {
                const res = await fetch(fetchUrl);
                const text = await res.text();
                let sep = text.includes('\t') ? '\t' : (text.includes(';') ? ';' : ',');
                const rows = text.split(/\r?\n/).map(r => r.split(sep));

                for (let tIdx = 0; tIdx < 7; tIdx++) {
                    let colIdx = (tIdx === 0) ? 7 : tIdx; 
                    let list = [];
                    for(let i = 1; i < rows.length; i++) {
                        let r = rows[i];
                        if (r.length > colIdx && r[0] && r[colIdx]) {
                            let time = r[0].trim();
                            let name = r[colIdx].trim();
                            if(time.includes(':') && name.length > 2 && name !== "---") {
                                let p = time.split(':');
                                list.push({ min: parseInt(p[0])*60 + parseInt(p[1]), display: time, name: name });
                            }
                        }
                    }
                    alleTageDaten[tIdx] = list.sort((a,b) => a.min - b.min);
                }
            } catch(e) { console.error("Datenfehler"); }
        }

        function updateDisplay() {
            const jetzt = new Date();
            const deZeit = new Date(jetzt.toLocaleString("en-US", {timeZone: "Europe/Berlin"}));
            const curMin = deZeit.getHours() * 60 + deZeit.getMinutes();
            const curDay = deZeit.getDay();
            
            document.getElementById('heutiger-tag').innerText = tage[curDay];
            document.getElementById('local-time').innerText = "Club-Zeit: " + deZeit.getHours() + ":" + (deZeit.getMinutes() < 10 ? '0' : '') + deZeit.getMinutes() + " Uhr";

            let heutigeChampis = alleTageDaten[curDay] || [];
            let next = null;
            let html = '';

            heutigeChampis.forEach(c => {
                const past = c.min <= curMin;
                html += `<div class="plan-entry" style="${past ? 'opacity:0.3' : ''}"><span>${c.name}</span><span class="time-tag">${c.display}</span></div>`;
                if(!next && c.min > curMin) {
                    let target = new Date(deZeit);
                    target.setHours(Math.floor(c.min/60), c.min%60, 0, 0);
                    next = { ...c, target };
                }
            });
            document.getElementById('tages-plan').innerHTML = html;

            if (!next) {
                const morgenIdx = (curDay + 1) % 7;
                let morgenChampis = alleTageDaten[morgenIdx] || [];
                if (morgenChampis.length > 0) {
                    let c = morgenChampis[0];
                    let target = new Date(deZeit);
                    target.setDate(target.getDate() + 1);
                    target.setHours(Math.floor(c.min/60), c.min%60, 0, 0);
                    next = { ...c, target };
                }
            }
            
            if(next) {
                const diff = next.target - deZeit;
                const m = Math.floor(diff/60000);
                const s = Math.floor((diff%60000)/1000);
                document.getElementById('champi-name').innerText = next.name;
                document.getElementById('countdown').innerText = m + ":" + (s < 10 ? '0' : '') + s;

                if(audioEnabled) {
                    if(m === 10 && s === 0 && lastPlayed !== "10m") {
                        document.getElementById('audio-miau').play();
                        lastPlayed = "10m";
                    }
                    if(m === 5 && s === 0 && lastPlayed !== "5m") {
                        let soundFile = next.name.toLowerCase().replace(/\s+/g, '') + ".mp3";
                        let player = document.getElementById('audio-champi');
                        player.src = soundFile;
                        player.play().catch(e => console.log("Datei nicht gefunden: " + soundFile));
                        lastPlayed = "5m";
                    }
                    if(m === 9 || m === 4) lastPlayed = ""; 
                }
            }
        }

        /* JUKEBOX FILTER & RENDER */
        function onFilterChange() {
            saveFilterState();
            renderJukebox();
        }

        function saveFilterState() {
            localStorage.setItem('filter_bpp', document.getElementById('chk-bpp').checked);
            localStorage.setItem('filter_js', document.getElementById('chk-js').checked);
            localStorage.setItem('filter_vbis', document.getElementById('chk-vbis').checked);
        }

        function loadFilterState() {
            const savedBpp = localStorage.getItem('filter_bpp');
            const savedJs = localStorage.getItem('filter_js');
            const savedVbis = localStorage.getItem('filter_vbis');

            document.getElementById('chk-bpp').checked = (savedBpp === null) ? true : (savedBpp === 'true');
            document.getElementById('chk-js').checked = (savedJs === null) ? true : (savedJs === 'true');
            document.getElementById('chk-vbis').checked = (savedVbis === null) ? true : (savedVbis === 'true');
        }

        function renderJukebox() {
            const container = document.getElementById('jukebox-playlist');
            const showBpp = document.getElementById('chk-bpp').checked;
            const showJs = document.getElementById('chk-js').checked;
            const showVbis = document.getElementById('chk-vbis').checked;

            let html = '';
            
            const gefilterteSongs = songListe.filter(song => {
                if (song.band === 'bpp' && showBpp) return true;
                if (song.band === 'js' && showJs) return true;
                if (song.band === 'vbis' && showVbis) return true;
                return false;
            });

            if (gefilterteSongs.length === 0) {
                html = '<p style="opacity: 0.6; padding: 10px;">Keine Band ausgewählt. Bitte aktiviere mindestens ein Kästchen.</p>';
            } else {
                gefilterteSongs.forEach(song => {
                    const saubererPfad = encodeURI(song.datei);
                    let bandLabel = '';
                    if (song.band === 'bpp') bandLabel = 'Baby Pink Panda';
                    else if (song.band === 'js') bandLabel = 'Jorvik Sisters';
                    else if (song.band === 'vbis') bandLabel = 'Vier Brüder im Staub';

                    html += `
                        <div class="plan-entry" style="flex-direction: column; align-items: flex-start;">
                            <strong>🐱 ${song.titel} <span style="font-size:0.8em; opacity:0.7;">(${bandLabel})</span></strong>
                            <audio controls preload="none">
                                <source src="${saubererPfad}" type="audio/mpeg">
                            </audio>
                        </div>
                    `;
                });
            }
            container.innerHTML = html;
        }

        /* GALLERY LADEN & NAVIGATION STEUERN */
        function loadCatGalleryDirect() {
            const galleryContainer = document.getElementById('cat-gallery');
            const modal = document.getElementById('imageModal');
            const closeBtn = document.getElementById('closeBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            galleryContainer.innerHTML = ''; 

            for (let i = 1; i <= gesamtBilder; i++) {
                const imagePath = `${folderPath}/tin-${i}.png`;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'cat-gallery-item';

                const img = document.createElement('img');
                img.src = imagePath;
                img.alt = `Cat Image ${i}`;
                img.loading = 'lazy';

                itemDiv.addEventListener('click', () => {
                    aktiverBildIndex = i;
                    oeffneGrossansicht();
                });

                itemDiv.appendChild(img);
                galleryContainer.appendChild(itemDiv);
            }

            closeBtn.addEventListener('click', schliesseGrossansicht);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) schliesseGrossansicht();
            });

            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                zeigeVorherigesBild();
            });
            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                zeigeNaechstesBild();
            });

            document.addEventListener('keydown', (e) => {
                if (modal.style.display === 'flex') {
                    if (e.key === 'ArrowLeft') zeigeVorherigesBild();
                    if (e.key === 'ArrowRight') zeigeNaechstesBild();
                    if (e.key === 'Escape') schliesseGrossansicht();
                }
            });
        }

        function oeffneGrossansicht() {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = `${folderPath}/tin-${aktiverBildIndex}.png`;
            modal.style.display = 'flex';
        }

        function schliesseGrossansicht() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function zeigeNaechstesBild() {
            aktiverBildIndex++;
            if (aktiverBildIndex > gesamtBilder) {
                aktiverBildIndex = 1;
            }
            oeffneGrossansicht();
        }

        function zeigeVorherigesBild() {
            aktiverBildIndex--;
            if (aktiverBildIndex < 1) {
                aktiverBildIndex = gesamtBilder;
            }
            oeffneGrossansicht();
        }
    </script>
</body>
</html>
