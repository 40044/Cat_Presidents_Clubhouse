<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Presidents Club House - Galerie</title>
    <style>
        /* Grundlegendes Layout der Seite */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* 
         * GALERIE GRID (RASTER)
         * Erstellt ein flexibles Raster. Jedes Bild ist mindestens 250px breit.
         */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 20px auto;
        }

        /* Styling der einzelnen Bild-Karten */
        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            transition: transform 0.2s ease-in-out;
            cursor: pointer; /* Zeigt den Zeigefinger, um anzuzeigen, dass das Bild klickbar ist */
        }

        .gallery-item:hover {
            transform: scale(1.03); /* Leichter Zoom-Effekt beim Drüberfahren */
        }

        /* Bildeigenschaften für die Vorschau */
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover; /* Schneidet das Bild sauber zu, ohne es zu verzerren */
            display: block;
        }

        /* 
         * MODAL (GROSSANSICHT)
         * Dunkler Hintergrund, der das gewählte Bild zentriert anzeigt
         */
        .modal {
            display: none; /* Standardmäßig ausgeblendet */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            object-fit: contain; /* Zeigt das Bild vollständig ohne Verzerrung an */
        }

        .close-button {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .close-button:hover {
            color: #bbb;
        }
    </style>
</head>
<body>

    <h1>🐾 Cat Presidents Club House - Galerie</h1>

    <!-- Der Container, in den das JavaScript die Bilder einfügt -->
    <div id="gallery" class="gallery-container"></div>

    <!-- Das Modal-Element für die Großansicht -->
    <div id="imageModal" class="modal">
        <span class="close-button" id="closeModal">&times;</span>
        <img class="modal-content" id="fullImage" alt="Großansicht Katze">
    </div>

    <script>
        // Array mit den Bild-URLs
        const imageUrls = [
            "https://i.postimg.cc/y3s5Hpwb/tin-1-2026-09-20-18-03-35.png",
            "https://i.postimg.cc/phN40LkR/tin-2-2026-09-20-18-01-55.png",
            "https://i.postimg.cc/1npTb1Y5/tin-3-2026-09-20-18-02-37.png",
            "https://i.postimg.cc/zbm6dGp5/tin-4-2026-09-20-18-01-49.png",
            "https://i.postimg.cc/hzF6CtMB/tin-5-2026-09-20-18-02-33.png",
            "https://i.postimg.cc/YG1VTByN/tin-6-2026-09-20-18-03-10.png",
            "https://i.postimg.cc/m1Bqsp0w/tin-7-2026-09-20-18-03-16.png",
            "https://i.postimg.cc/1VBd5cSm/tin-8-2026-09-20-18-16-39.png",
            "https://i.postimg.cc/8fN3SXqx/tin-9-2026-09-20-18-16-31.png",
            "https://i.postimg.cc/QVqNW2xB/tin-10-2026-09-20-18-16-45.png",
            "https://i.postimg.cc/XGkWd5Wm/tin-11-2026-09-20-18-27-23.png",
            "https://i.postimg.cc/vgtyfnyh/tin-12-2026-09-20-18-27-20.png",
            "https://i.postimg.cc/0zz9FrGG/tin-13-2026-09-20-18-26-47.png",
            "https://i.postimg.cc/75jqkDX3/tin-14-2026-09-20-18-26-50.png",
            "https://i.postimg.cc/bZ4qh8LK/tin-15-2026-09-20-18-27-01.png",
            "https://i.postimg.cc/Q93sFb2H/tin-16-2026-09-20-18-27-11.png",
            "https://i.postimg.cc/zVXzwxVs/tin-17-2026-09-20-18-25-11.png",
            "https://i.postimg.cc/Pvfj4qrd/tin-18-2026-09-20-18-28-50.png",
            "https://i.postimg.cc/2bpMHSGt/tin-19-2026-05-07-19-17-09.png",
            "https://i.postimg.cc/0rC5JT20/tin-20-2026-09-20-18-17-58.png",
            "https://i.postimg.cc/9DDcKzPy/tin-21-2026-09-20-18-26-32.png",
            "https://i.postimg.cc/TLJxgbG8/tin-22-2026-09-20-18-28-41.png",
            "https://i.postimg.cc/7bqwDK1W/tin-23-2026-09-20-18-29-54.png",
            "https://i.postimg.cc/5jfb1s5D/tin-24-2026-09-20-18-30-07.png",
            "https://i.postimg.cc/XXn43sKP/tin-25-2026-09-20-18-29-59.png",
            "https://i.postimg.cc/CnMgNKLd/tin-26-2026-09-20-18-29-45.png",
            "https://i.postimg.cc/K45cg6vN/tin-27-2026-09-20-18-18-09.png",
            "https://i.postimg.cc/GHhLPXHF/tin-28-2026-09-20-18-23-11.png"
        ];

        // Modal-Elemente referenzieren
        const modal = document.getElementById('imageModal');
        const fullImage = document.getElementById('fullImage');
        const closeModal = document.getElementById('closeModal');

        // Funktion zum Erzeugen der Galerie
        function renderGallery() {
            const galleryContainer = document.getElementById('gallery');
            
            imageUrls.forEach((url, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'gallery-item';

                const img = document.createElement('img');
                img.src = url;
                img.alt = `Katzenbild ${index + 1}`;
                img.loading = "lazy";

                // Klick-Event für die Großansicht
                itemDiv.addEventListener('click', () => {
                    fullImage.src = url;
                    modal.style.display = 'flex';
                });

                itemDiv.appendChild(img);
                galleryContainer.appendChild(itemDiv);
            });
        }

        // Event-Listener zum Schließen des Modals
        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Schließen bei Klick außerhalb des Bildes
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Galerie initialisieren
        renderGallery();
    </script>
</body>
</html>
