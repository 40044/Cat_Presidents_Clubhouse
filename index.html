<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Presidents Clubhouse</title>
    <style>
        /* =========================================================
           ORIGINAL STYLES (Unverändert übernommen)
           ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #ff69b4;
            font-size: 2.2em;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 0.95em;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .card h2 {
            color: #ff69b4;
            font-size: 1.4em;
            margin-bottom: 15px;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 8px;
        }

        /* SSO & Barometer Styling */
        .sso-box {
            background: #252525;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 1.1em;
            text-align: center;
            border-left: 4px solid #ff69b4;
        }

        .sso-code {
            color: #00ffcc;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Champi-Barometer autoscroll container */
        .barometer-container {
            max-height: 180px;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding-right: 5px;
        }

        /* Jukebox Filter Component */
        .filter-container {
            background-color: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .filter-label {
            font-weight: bold;
            color: #ff69b4;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .checkbox-group input {
            cursor: pointer;
            accent-color: #ff69b4;
        }

        /* Jukebox Playlist Entries */
        .playlist {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .plan-entry {
            background-color: #252525;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-left: 3px solid #ff69b4;
        }

        .plan-entry strong {
            color: #ffffff;
        }

        .band-tag {
            font-size: 0.8em;
            opacity: 0.75;
            color: #ff69b4;
        }

        audio {
            width: 100%;
            height: 36px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🐱 Cat Presidents Clubhouse</h1>
        <div class="subtitle">Willkommen im offiziellen Clubhaus</div>
    </header>

    <div class="container">

        <!-- 1. SSO CODE TRACKER -->
        <div class="card">
            <h2>🔑 SSO-Code Tracker</h2>
            <div class="sso-box">
                Aktueller Code: <span class="sso-code">CATPRESIDENTS2026</span>
            </div>
        </div>

        <!-- 2. CHAMPI-BAROMETER -->
        <div class="card">
            <h2>🏆 Daily Champi-Barometer</h2>
            <div class="barometer-container" id="champi-barometer">
                <p>Nächstes Championat: <strong style="color: #ffcc00;">19:00 Uhr</strong></p>
                <p style="margin-top: 8px; font-size: 0.9em; opacity: 0.8;">Automatisches Zentrieren/Scrolling aktiv.</p>
            </div>
        </div>

        <!-- 3. JUKEBOX -->
        <div class="card">
            <h2>🎵 Clubhouse Jukebox</h2>
            
            <!-- Band Filter Box mit 3 Bands -->
            <div class="filter-container">
                <span class="filter-label">🎸 Bands:</span>
                <label class="checkbox-group">
                    <input type="checkbox" id="chk-bpp" onchange="onFilterChange()"> 
                    <span>Baby Pink Panda</span>
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="chk-js" onchange="onFilterChange()"> 
                    <span>Jorvik Sisters</span>
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="chk-vbis" onchange="onFilterChange()"> 
                    <span>Vier Brüder im Staub</span>
                </label>
            </div>

            <!-- Playlist Output Container -->
            <div id="jukebox-playlist" class="playlist"></div>
        </div>

    </div>

    <script>
        // ==========================================
        // SONG DATABASE ARRAY
        // NEUER SONG IST AN ERSTER STELLE (GANZ OBEN)
        // ==========================================
        const songListe = [
            { titel: "Das wilde Banjo", datei: "Das_wilde_Banjo.mp3", band: "vbis" }, // NEWEST TRACK FIRST
            { titel: "Keine Fahnen", datei: "Keine_Fahnen.mp3", band: "js" },
            { titel: "Illegale Rennen", datei: "Illegale_Rennen.mp3", band: "bpp" },
            { titel: "Zaunrennen", datei: "Zaunrennen.mp3", band: "js" },
            { titel: "Slalomrennen", datei: "Slalomrennen.mp3", band: "js" },
            { titel: "Happy Birthday", datei: "Happy_Birthday.mp3", band: "js" },
            { titel: "Der Frieden kommt", datei: "Der_Frieden_kommt.mp3", band: "js" },
            { titel: "Cat President", datei: "Cat_President.mp3", band: "bpp" },
            { titel: "Drachenhexe", datei: "Drachenhexe.mp3", band: "bpp" },
            { titel: "Keine Geschenke", datei: "Keine_Geschenke.mp3", band: "bpp" },
            { titel: "Lieber Lautt 2", datei: "Lieber_Lautt-2.mp3", band: "bpp" },
            { titel: "Märchengast", datei: "Märchengast.mp3", band: "bpp" },
            { titel: "Verstecktes Dorf", datei: "Verstecktes_Dorf.mp3", band: "bpp" },
            { titel: "Wind in den Haaren", datei: "Wind-in_den_Haaren.mp3", band: "bpp" },
            { titel: "Wo sind die Wölfe", datei: "Wo_sind_die_Wölfe.mp3", band: "bpp" },
            { titel: "Zirkus von Pandoria", datei: "Zirkus_von_Pandoria.mp3", band: "bpp" }
        ];

        // ==========================================
        // LOCALSTORAGE FILTER LOGIC
        // ==========================================
        function saveFilterState() {
            const bppChecked = document.getElementById('chk-bpp').checked;
            const jsChecked = document.getElementById('chk-js').checked;
            const vbisChecked = document.getElementById('chk-vbis').checked;
            
            localStorage.setItem('filter_bpp', bppChecked);
            localStorage.setItem('filter_js', jsChecked);
            localStorage.setItem('filter_vbis', vbisChecked);
        }

        function loadFilterState() {
            const savedBpp = localStorage.getItem('filter_bpp');
            const savedJs = localStorage.getItem('filter_js');
            const savedVbis = localStorage.getItem('filter_vbis');

            // Defaults: BPP = active (true), JS = active (true), VBIS = inactive (false)
            document.getElementById('chk-bpp').checked = (savedBpp === null) ? true : (savedBpp === 'true');
            document.getElementById('chk-js').checked = (savedJs === null) ? true : (savedJs === 'true');
            document.getElementById('chk-vbis').checked = (savedVbis === null) ? false : (savedVbis === 'true');
        }

        function onFilterChange() {
            saveFilterState();
            renderJukebox();
        }

        // ==========================================
        // RENDER JUKEBOX FUNCTION
        // ==========================================
        function renderJukebox() {
            const container = document.getElementById('jukebox-playlist');
            const showBpp = document.getElementById('chk-bpp').checked;
            const showJs = document.getElementById('chk-js').checked;
            const showVbis = document.getElementById('chk-vbis').checked;

            let html = '';
            
            const gefilterteSongs = songListe.filter(song => {
                if (song.band === 'bpp' && showBpp) return true;
                if (song.band === 'js' && showJs) return true;
                if (song.band === 'vbis' && showVbis) return true;
                return false;
            });

            if (gefilterteSongs.length === 0) {
                html = '<p style="opacity: 0.6; padding: 10px;">Keine Band ausgewählt. Bitte aktiviere mindestens ein Kästchen.</p>';
            } else {
                gefilterteSongs.forEach(song => {
                    const saubererPfad = encodeURI(song.datei);
                    
                    let bandLabel = '';
                    if (song.band === 'bpp') bandLabel = 'Baby Pink Panda';
                    else if (song.band === 'js') bandLabel = 'Jorvik Sisters';
                    else if (song.band === 'vbis') bandLabel = 'Vier Brüder im Staub';

                    html += `
                        <div class="plan-entry">
                            <strong>🐱 ${song.titel} <span class="band-tag">(${bandLabel})</span></strong>
                            <audio controls preload="none">
                                <source src="${saubererPfad}" type="audio/mpeg">
                            </audio>
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html;
            setupJukeboxAudio();
        }

        // Single Audio Play Logic
        function setupJukeboxAudio() {
            const audios = document.querySelectorAll('audio');
            audios.forEach(audio => {
                audio.addEventListener('play', () => {
                    audios.forEach(otherAudio => {
                        if (otherAudio !== audio) {
                            otherAudio.pause();
                        }
                    });
                });
            });
        }

        // Auto-Scroll Logic for Champi-Barometer
        function initChampiBarometer() {
            const barometer = document.getElementById('champi-barometer');
            if (barometer) {
                barometer.scrollTop = barometer.scrollHeight / 2;
            }
        }

        // Initialization on Load
        window.addEventListener('DOMContentLoaded', () => {
            loadFilterState();
            renderJukebox();
            initChampiBarometer();
        });
    </script>
</body>
</html>
