<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Presidents Clubhouse 🐱</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #1a2634; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 20px; 
            display: block; 
        }
        .header { 
            text-align: center; 
            padding: 20px 0; 
        }
        .logo-text { 
            color: #ff85a2; 
            font-size: 2.5em; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }
        
        .main-container { 
            display: flex; 
            gap: 20px; 
            justify-content: center; 
            flex-wrap: wrap; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        .column { 
            background: #253341; 
            padding: 20px; 
            border-radius: 20px; 
            border: 3px solid #ff85a2; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); 
        }
        
        .left { flex: 1; min-width: 280px; } 
        .middle { flex: 2; min-width: 350px; } 
        .right { flex: 1; min-width: 300px; }  
        
        .full-width { 
            width: 100%; 
            max-width: 1200px; 
            margin: 20px auto 0 auto; 
            box-sizing: border-box; 
        }

        .status-box { 
            background: #3d3d29; 
            padding: 20px; 
            border-radius: 15px; 
            border: 2px dashed #fbc02d; 
            text-align: center; 
            position: relative; 
        }
        .plan-entry { 
            background: #2d3d4d; 
            padding: 10px; 
            margin-bottom: 8px; 
            border-radius: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-left: 5px solid #8bc34a; 
        }
        
        /* Stylische Bild-Anzeige für die Championate */
        .champi-icon {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 10px;
            border: 1px solid #ff85a2;
            vertical-align: middle;
        }

        .champi-info {
            display: flex;
            align-items: center;
        }

        /* Markierung für das aktuell nächste Championat */
        .active-champi { 
            border-left: 5px solid #fbc02d; 
            background: #3d4d5d; 
        }

        .code-expired { 
            border-left: 5px solid #607d8b; 
            opacity: 0.4; 
            text-decoration: line-through; 
        }
        .time-tag { 
            background: #ff85a2; 
            color: white; 
            padding: 3px 8px; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 0.9em; 
        }
        h3 { 
            color: #ff85a2; 
            border-bottom: 1px solid #3d4d5d; 
            padding-bottom: 5px; 
            margin-top: 0; 
        }
        .edit-link { 
            display: block; 
            margin-top: 15px; 
            color: #ff85a2; 
            text-decoration: none; 
            font-size: 0.85em; 
            text-align: center; 
            background: rgba(255, 133, 162, 0.1); 
            padding: 8px; 
            border-radius: 10px; 
            border: 1px solid #ff85a2; 
        }
        #sound-status { 
            font-size: 0.9em; 
            padding: 5px; 
            border-radius: 5px; 
            margin-top: 10px; 
            font-weight: bold; 
        }
        .sound-off { 
            background: #ff5252; 
            color: white; 
            animation: blinker 1.5s linear infinite; 
            cursor: pointer; 
        }
        .sound-on { 
            background: #4caf50; 
            color: white; 
        }
        @keyframes blinker { 
            50% { opacity: 0.3; } 
        }
        
        audio { 
            width: 100%; 
            margin-top: 5px; 
        }

        /* Styling für die Band-Filter-Box */
        .filter-container {
            display: flex;
            gap: 20px;
            align-items: center;
            background: #2d3d4d;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .filter-label {
            font-weight: bold;
            color: #ff85a2;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .checkbox-group input {
            cursor: pointer;
            accent-color: #ff85a2;
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body onclick="enableAudio()">

    <div class="header">
        <p class="logo-text">🐾 Cat Presidents Clubhouse 🐾</p>
    </div>

    <div class="main-container">
        
        <!-- LINKS: SSO CODES -->
        <div class="column left">
            <h3>🎁 SSO Codes</h3>
            <div id="code-list">Lade Codes...</div>
            <a href="https://docs.google.com/spreadsheets/d/1qBZrDQApoIYHCQ9Q2rlFpjQ9KKZWaEBOnf7lyojjohs/edit" target="_blank" class="edit-link">➕ Codes bearbeiten</a>
        </div>

        <!-- MITTE: BAROMETER & TAGESPLAN -->
        <div class="column middle">
            <h3>📊 Champi-Barometer</h3>
            <div class="status-box">
                <p><strong>HEUTE: <span id="heutiger-tag">...</span></strong></p>
                <h2 id="champi-name" style="color: #ff85a2; margin: 10px 0;">Suche...</h2>
                <p>Countdown: <span id="countdown" style="font-weight: bold; color: #fbc02d; font-size: 1.6em;">--:--</span></p>
                <p id="local-time" style="font-size: 0.8em; opacity: 0.6;"></p>
                <div id="sound-status" class="sound-off">⚠️ KLICKEN: MIAU IST NOCH STUMM! ⚠️</div>
            </div>
            <h3 style="margin-top: 25px;">📅 Tagesplan</h3>
            <div id="tages-plan" style="max-height: 400px; overflow-y: auto;"></div>
        </div>

        <!-- RECHTS: CHAT -->
        <div class="column right">
            <h3>💬 Chat</h3>
            <script src="https://minnit.chat/js/embed.js?c=1772345192" defer></script>
            <span class="minnit-chat-sembed" data-chatname="https://organizations.minnit.chat/443778136316393/c/Main?embed&&dark=1" data-style="width:100%; height:550px;">Chat</span>
        </div>

    </div>

    <!-- UNTEN: CLUB-JUKEBOX -->
    <div class="column full-width">
        <h3>🎵 Club-Jukebox</h3>
        
        <!-- BAND-FILTER INKLUSIVE 4 BRÜDER IM STAUB -->
        <div class="filter-container">
            <span class="filter-label">🎸 Bands auswählen:</span>
            <label class="checkbox-group">
                <input type="checkbox" id="chk-bpp" onchange="onFilterChange()"> 
                <span>Baby Pink Panda (Punk)</span>
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="chk-js" onchange="onFilterChange()"> 
                <span>Jorvik Sisters (Pop)</span>
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="chk-vbis" onchange="onFilterChange()"> 
                <span>4 Brüder im Staub</span>
            </label>
        </div>

        <!-- WIEDERGABE-EINSTELLUNGEN -->
        <div style="margin-bottom: 20px; background: #2d3d4d; padding: 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px;">
            <label for="loop-mode" style="font-weight: bold; color: #ff85a2;">🔁 Wiederholung / Loop:</label>
            <select id="loop-mode" style="background: #1a2634; color: white; border: 1px solid #ff85a2; padding: 5px 10px; border-radius: 5px; cursor: pointer;">
                <option value="none">Kein Loop (Spielt Playlist 1x durch)</option>
                <option value="playlist">Ganze Playlist wiederholen</option>
                <option value="single">Aktuellen Song wiederholen (Einzel-Loop)</option>
            </select>
        </div>

        <!-- SONG-CONTAINER -->
        <div id="jukebox-playlist"></div>
    </div>

    <audio id="audio-miau" src="miau.mp3" preload="auto"></audio>
    <audio id="audio-champi" preload="auto"></audio>

    <script>
        let alleTageDaten = {};
        let audioEnabled = false;
        let lastPlayed = ""; 
        let hasAutoScrolled = false;
        const tage = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];

        // SONG-LISTE MIT VOLLSTÄNDIGEN 23 SONGS
        const songListe = [
            { titel: "Die Ra-Kate", datei: "Die_Ra-Kate.mp3", band: "js" },
            { titel: "Lvl 13", datei: "Lvl_13.mp3", band: "js" },
            { titel: "Farah", datei: "Farah.mp3", band: "js" },
            { titel: "Simple Things", datei: "Simple_Things.mp3", band: "js" },
            { titel: "Satteltaschen Parade", datei: "Satteltaschen_Parade.mp3", band: "js" },
            { titel: "Überall Tanzen", datei: "Überall_Tanzen.mp3", band: "js" },
            { titel: "Schnarchstunde im Stall", datei: "Schnarchstunde_im_Stall.mp3", band: "js" },
            { titel: "Sturm ueber Valedale", datei: "Sturm_ueber_Valedale.mp3", band: "js" },
            { titel: "Licht gegen Maschinen", datei: "Licht_gegen_Maschinen.mp3", band: "js" },
            { titel: "Die perfekte Line", datei: "Die_perfekte_Line.mp3", band: "vbis" },
            { titel: "Der lange Ritt", datei: "Der_lange_Ritt.mp3", band: "vbis" },
            { titel: "Geisterstunde", datei: "Erster_und_Letzter.mp3", band: "vbis" },
            { titel: "Das wilde Banjo", datei: "Das_wilde_Banjo.mp3", band: "vbis" },
            { titel: "Champireihe", datei: "Champireihe.mp3", band: "js" },
            { titel: "Pleite", datei: "Pleite.mp3", band: "js" },
            { titel: "Fuck Off Fashion", datei: "Fuck_Off_Fashion.mp3", band: "bpp" },
            { titel: "Lass mich mal durch", datei: "Lass_mich_mal_durch.mp3", band: "js" },
            { titel: "Verpiss dich", datei: "Verpiss_dich.mp3", band: "bpp" },
            { titel: "Die Reihe", datei: "Die_Reihe.mp3", band: "js" },
            { titel: "Ein starkes Team", datei: "Ein_starkes_Team.mp3", band: "js" },
            { titel: "Keine Fahnen", datei: "Keine_Fahnen.mp3", band: "js" },
            { titel: "Illegale Rennen", datei: "Illegale_Rennen.mp3", band: "bpp" },
            { titel: "Zaunrennen", datei: "Zaunrennen.mp3", band: "js" },
            { titel: "Slalomrennen", datei: "Slalomrennen.mp3", band: "js" },
            { titel: "Happy Birthday", datei: "Happy_Birthday.mp3", band: "js" },
            { titel: "Der Frieden kommt", datei: "Der_Frieden_kommt.mp3", band: "js" },
            { titel: "Cat President", datei: "Cat_President.mp3", band: "bpp" },
            { titel: "Drachenhexe", datei: "Drachenhexe.mp3", band: "bpp" },
            { titel: "Keine Geschenke", datei: "Keine_Geschenke.mp3", band: "bpp" },
            { titel: "Lieber Lautt 2", datei: "Lieber_Lautt-2.mp3", band: "bpp" },
            { titel: "Märchengast", datei: "Märchengast.mp3", band: "bpp" },
            { titel: "Verstecktes Dorf", datei: "Verstecktes_Dorf.mp3", band: "bpp" },
            { titel: "Wind in den Haaren", datei: "Wind-in_den_Haaren.mp3", band: "bpp" },
            { titel: "Wo sind die Wölfe", datei: "Wo_sind_die_Wölfe.mp3", band: "bpp" },
            { titel: "Zirkus von Pandoria", datei: "Zirkus_von_Pandoria.mp3", band: "bpp" }
        ];

        window.onload = function() { 
            init(); 
            loadFilterState();
            renderJukebox();
        };

        function onFilterChange() {
            saveFilterState();
            renderJukebox();
        }

        function saveFilterState() {
            const bppChecked = document.getElementById('chk-bpp').checked;
            const jsChecked = document.getElementById('chk-js').checked;
            const vbisChecked = document.getElementById('chk-vbis').checked;
            
            localStorage.setItem('filter_bpp', bppChecked);
            localStorage.setItem('filter_js', jsChecked);
            localStorage.setItem('filter_vbis', vbisChecked);
        }

        function loadFilterState() {
            const savedBpp = localStorage.getItem('filter_bpp');
            const savedJs = localStorage.getItem('filter_js');
            const savedVbis = localStorage.getItem('filter_vbis');

            document.getElementById('chk-bpp').checked = (savedBpp !== null) ? (savedBpp === 'true') : false;
            document.getElementById('chk-js').checked = (savedJs !== null) ? (savedJs === 'true') : false;
            document.getElementById('chk-vbis').checked = (savedVbis !== null) ? (savedVbis === 'true') : false;
        }

        function enableAudio() {
            if(!audioEnabled) {
                audioEnabled = true;
                const status = document.getElementById('sound-status');
                if(status) {
                    status.innerText = "🔊 SOUNDS AKTIV!";
                    status.className = "sound-on";
                }
                document.getElementById('audio-miau').play().then(() => { 
                    document.getElementById('audio-miau').pause(); 
                    document.getElementById('audio-miau').currentTime = 0; 
                }).catch(e => {});
            }
        }

        async function init() {
            await loadChampiData();
            await loadCodes();
            updateDisplay();
            setInterval(updateDisplay, 1000);
        }

        function renderJukebox() {
            const container = document.getElementById('jukebox-playlist');
            const showBpp = document.getElementById('chk-bpp').checked;
            const showJs = document.getElementById('chk-js').checked;
            const showVbis = document.getElementById('chk-vbis').checked;

            let html = '';
            
            const gefilterteSongs = songListe.filter(song => {
                if (song.band === 'bpp' && showBpp) return true;
                if (song.band === 'js' && showJs) return true;
                if (song.band === 'vbis' && showVbis) return true;
                return false;
            });

            if (gefilterteSongs.length === 0) {
                html = '<p style="opacity: 0.6; padding: 10px;">Keine Band ausgewählt. Bitte aktiviere mindestens ein Kästchen.</p>';
            } else {
                gefilterteSongs.forEach(song => {
                    const saubererPfad = encodeURI(song.datei);
                    let bandLabel = 'Baby Pink Panda';
                    if (song.band === 'js') bandLabel = 'Jorvik Sisters';
                    if (song.band === 'vbis') bandLabel = '4 Brüder im Staub';

                    html += `
                        <div class="plan-entry" style="flex-direction: column; align-items: flex-start;">
                            <strong>🐱 ${song.titel} <span style="font-size:0.8em; opacity:0.7;">(${bandLabel})</span></strong>
                            <audio controls preload="none">
                                <source src="${saubererPfad}" type="audio/mpeg">
                            </audio>
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html;
            setupJukebox();
        }

        function setupJukebox() {
            const playlistContainer = document.getElementById('jukebox-playlist');
            const loopSelect = document.getElementById('loop-mode');
            const audioPlayers = Array.from(playlistContainer.querySelectorAll('audio'));

            audioPlayers.forEach((player, index) => {
                player.addEventListener('play', () => {
                    audioPlayers.forEach(otherPlayer => {
                        if (otherPlayer !== player) {
                            otherPlayer.pause();
                            otherPlayer.currentTime = 0;
                        }
                    });
                });

                player.addEventListener('ended', () => {
                    const mode = loopSelect.value;

                    if (mode === 'single') {
                        player.currentTime = 0;
                        player.play();
                    } else {
                        const nextIndex = index + 1;
                        if (nextIndex < audioPlayers.length) {
                            audioPlayers[nextIndex].currentTime = 0;
                            audioPlayers[nextIndex].play();
                        } else if (mode === 'playlist') {
                            audioPlayers[0].currentTime = 0;
                            audioPlayers[0].play();
                        }
                    }
                });
            });
        }

        /* GOOGLE SHEETS CHAMPIONAT-DATEN */
        async function loadChampiData() {
            const spreadsheetId = '1rDCPInp1BjzJ2ced7Pv24ZCi8La6mRCCfFEovNiSEoE';
            const fetchUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv`;
            try {
                const res = await fetch(fetchUrl);
                const text = await res.text();
                let sep = text.includes('\t') ? '\t' : (text.includes(';') ? ';' : ',');
                const rows = text.split(/\r?\n/).map(r => r.split(sep));

                for (let tIdx = 0; tIdx < 7; tIdx++) {
                    let colIdx = (tIdx === 0) ? 7 : tIdx; 
                    let list = [];
                    for(let i = 1; i < rows.length; i++) {
                        let r = rows[i];
                        if (r.length > colIdx && r[0] && r[colIdx]) {
                            let time = r[0].trim();
                            let name = r[colIdx].trim();
                            if(time.includes(':') && name.length > 2 && name !== "---") {
                                let p = time.split(':');
                                list.push({ min: parseInt(p[0])*60 + parseInt(p[1]), display: time, name: name });
                            }
                        }
                    }
                    alleTageDaten[tIdx] = list.sort((a,b) => a.min - b.min);
                }
            } catch(e) { console.error("Datenfehler"); }
        }

        function updateDisplay() {
            const jetzt = new Date();
            const deZeit = new Date(jetzt.toLocaleString("en-US", {timeZone: "Europe/Berlin"}));
            const curMin = deZeit.getHours() * 60 + deZeit.getMinutes();
            const curDay = deZeit.getDay();
            const morgenIdx = (curDay + 1) % 7;
            
            document.getElementById('heutiger-tag').innerText = tage[curDay];
            document.getElementById('local-time').innerText = "Club-Zeit: " + deZeit.getHours() + ":" + (deZeit.getMinutes() < 10 ? '0' : '') + deZeit.getMinutes() + " Uhr";

            let heutigeChampis = alleTageDaten[curDay] || [];
            let morgigeChampis = alleTageDaten[morgenIdx] || [];

            let kombinerteListe = [];

            heutigeChampis.forEach(c => {
                let rennZeit = new Date(deZeit);
                rennZeit.setHours(Math.floor(c.min / 60), c.min % 60, 0, 0);
                kombinerteListe.push({ ...c, zielZeit: rennZeit, istMorgen: false });
            });

            morgigeChampis.forEach(c => {
                let rennZeit = new Date(deZeit);
                rennZeit.setDate(rennZeit.getDate() + 1);
                rennZeit.setHours(Math.floor(c.min / 60), c.min % 60, 0, 0);
                kombinerteListe.push({ ...c, zielZeit: rennZeit, istMorgen: true });
            });

            let next = null;
            let html = '';
            let trennerGesezt = false;

            kombinerteListe.forEach(c => {
                const past = c.zielZeit <= deZeit;
                let isNext = false;

                if (!next && c.zielZeit > deZeit) {
                    next = { name: c.name, target: c.zielZeit };
                    isNext = true;
                }

                if (c.istMorgen && !trennerGesezt) {
                    html += `<div style="text-align: center; margin: 15px 0 8px 0; color: #ff85a2; font-weight: bold; border-bottom: 1px dashed #ff85a2; padding-bottom: 5px;">
                                🌅 ${tage[morgenIdx]}
                             </div>`;
                    trennerGesezt = true;
                }

                const activeClass = isNext ? 'active-champi' : '';
                const activeId = isNext ? 'id="next-champi-entry"' : '';

                // Bildpfad anhand des Namens auflösen
                let imgFileName = c.name.toLowerCase().replace(/\s+/g, '') + '.png';

                html += `<div ${activeId} class="plan-entry ${activeClass}" style="${past ? 'opacity:0.3' : ''}">
                            <div class="champi-info">
                                <img src="${imgFileName}" class="champi-icon" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'32\' height=\'32\' viewBox=\'0 0 24 24\' fill=\'%23ff85a2\'><path d=\'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z\'/></svg>';">
                                <span>${c.name}</span>
                            </div>
                            <span class="time-tag">${c.display}</span>
                         </div>`;
            });

            document.getElementById('tages-plan').innerHTML = html;

            if (!hasAutoScrolled) {
                const activeElem = document.getElementById('next-champi-entry');
                if (activeElem) {
                    activeElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    hasAutoScrolled = true;
                }
            }

            if (next) {
                const diff = next.target - deZeit;
                const m = Math.floor(diff / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('champi-name').innerText = next.name;
                document.getElementById('countdown').innerText = m + ":" + (s < 10 ? '0' : '') + s;

                if (audioEnabled) {
                    if (m === 10 && s === 0 && lastPlayed !== "10m") {
                        document.getElementById('audio-miau').play();
                        lastPlayed = "10m";
                    }
                    if (m === 5 && s === 0 && lastPlayed !== "5m") {
                        let soundFile = next.name.toLowerCase().replace(/\s+/g, '') + ".mp3";
                        let player = document.getElementById('audio-champi');
                        player.src = soundFile;
                        player.play().catch(e => console.log("Datei nicht gefunden: " + soundFile));
                        lastPlayed = "5m";
                    }
                    if (m === 9 || m === 4) lastPlayed = ""; 
                }
            }
        }

        /* GOOGLE SHEETS SSO CODES */
        async function loadCodes() {
            const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRlKQDgI4SCBqe8Kv0ZSvzDIfXW5YxyU3kLrR4h0LgK7vMdpNxgcpJfU0jP4xD0v9FOs7JQ74StZOHC/pub?gid=0&single=true&output=csv';
            try {
                const res = await fetch(url);
                const text = await res.text();
                const rows = text.split(/\r?\n/).slice(1);
                let html = '';
                rows.forEach(r => {
                    const c = r.split(',');
                    if(c[0]) {
                        let isExpired = (c[2] && c[2].trim().length > 0) ? 'code-expired' : '';
                        html += `<div class="plan-entry ${isExpired}"><strong>${c[0].replace(/"/g,'')}</strong><span>${c[1]||''}</span></div>`;
                    }
                });
                document.getElementById('code-list').innerHTML = html;
            } catch(e) {}
        }
    </script>
</body>
</html>
