<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katzen Galerie</title>
    <style>
        /* Grundlegendes Layout der Seite */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* 
         * GALERIE GRID (RASTER)
         * Erstellt ein flexibles Raster. Jedes Bild ist mindestens 250px breit.
         */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 20px auto;
        }

        /* Styling der einzelnen Bild-Karten */
        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            transition: transform 0.2s ease-in-out;
        }

        .gallery-item:hover {
            transform: scale(1.03); /* Leichter Zoom-Effekt beim Drüberfahren */
        }

        /* Bildeigenschaften für messerscharfe Anzeige */
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover; /* Schneidet das Bild sauber zu, ohne es zu verzerren */
            display: block;
        }
    </style>
</head>
<body>

    <h1>🐾 Meine Katzen Galerie</h1>

    <!-- Der Container, in den das JavaScript die Bilder einfügt -->
    <div id="gallery" class="gallery-container"></div>

    <script>
        // Array mit all deinen 28 direkten Bild-URLs aus der CSV

            "https://i.postimg.cc/GHhLPXHF/tin-28-2026-09-20-18-23-11.png"
        ];

        // Funktion zum Erzeugen der Galerie
        function renderGallery() {
            const galleryContainer = document.getElementById('gallery');
            
            // Schleife durch alle Bild-URLs
            imageUrls.forEach((url, index) => {
                // 1. Element für das Bild-Kästchen erstellen
                const itemDiv = document.createElement('div');
                itemDiv.className = 'gallery-item';

                // 2. Img-Element erstellen
                const img = document.createElement('img');
                img.src = url;
                img.alt = `Katzenbild ${index + 1}`;
                img.loading = "lazy"; // Lädt Bilder erst, wenn sie im Sichtfeld sind (spart Ladezeit)

                // 3. Zusammenbauen und im HTML platzieren
                itemDiv.appendChild(img);
                galleryContainer.appendChild(itemDiv);
            });
        }

        // Galerie beim Laden der Seite aufrufen
        renderGallery();
    </script>
</body>
</html>
