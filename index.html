<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Presidents Clubhouse</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        h1 {
            color: #ff69b4;
            margin-bottom: 20px;
            text-align: center;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #ff69b4;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        /* SSO Code Section */
        .sso-code {
            font-weight: bold;
            color: #00ffcc;
        }

        /* Champi Barometer Section */
        .barometer-box {
            max-height: 150px;
            overflow-y: auto;
            background: #252525;
            padding: 10px;
            border-radius: 5px;
        }

        /* Jukebox Filter Section */
        .filter-group {
            margin-bottom: 15px;
            background: #252525;
            padding: 10px;
            border-radius: 5px;
        }

        .checkbox-label {
            margin-right: 15px;
            cursor: pointer;
            display: inline-block;
        }

        /* Song List Entry */
        .plan-entry {
            background-color: #2a2a2a;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 4px solid #ff69b4;
        }

        audio {
            margin-top: 5px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <h1>🐱 Cat Presidents Clubhouse</h1>

    <!-- SSO-CODE TRACKER -->
    <div class="card">
        <h2>🔑 SSO-Code Tracker</h2>
        <p>Aktueller SSO-Code: <span class="sso-code">CATPRESIDENTS2026</span></p>
    </div>

    <!-- DAILY CHAMPI-BAROMETER -->
    <div class="card">
        <h2>🏆 Daily Champi-Barometer</h2>
        <div class="barometer-box" id="champi-barometer">
            <p>Nächstes Championat: <strong style="color: #ffcc00;">19:00 Uhr</strong></p>
            <p style="opacity: 0.7; font-size: 0.9em; margin-top: 5px;">Automatisches Zentrieren/Scrolling aktiv.</p>
        </div>
    </div>

    <!-- CLUBHOUSE JUKEBOX -->
    <div class="card">
        <h2>🎵 Clubhouse Jukebox</h2>

        <!-- Original Filter mit 2 Bands -->
        <div class="filter-group">
            <strong>Bands filtern:</strong><br><br>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-bpp" onchange="onFilterChange()"> Baby Pink Panda (Punk)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-js" onchange="onFilterChange()"> Jorvik Sisters (Pop)
            </label>
        </div>

        <div id="jukebox-playlist"></div>
    </div>

    <script>
        // ORIGINAL SONG ARRAY (VOR DEN ÄNDERUNGEN)
        const songListe = [
            { titel: "Keine Fahnen", datei: "Keine_Fahnen.mp3", band: "js" },
            { titel: "Illegale Rennen", datei: "Illegale_Rennen.mp3", band: "bpp" },
            { titel: "Zaunrennen", datei: "Zaunrennen.mp3", band: "js" },
            { titel: "Slalomrennen", datei: "Slalomrennen.mp3", band: "js" },
            { titel: "Happy Birthday", datei: "Happy_Birthday.mp3", band: "js" },
            { titel: "Der Frieden kommt", datei: "Der_Frieden_kommt.mp3", band: "js" },
            { titel: "Cat President", datei: "Cat_President.mp3", band: "bpp" },
            { titel: "Drachenhexe", datei: "Drachenhexe.mp3", band: "bpp" },
            { titel: "Keine Geschenke", datei: "Keine_Geschenke.mp3", band: "bpp" },
            { titel: "Lieber Lautt 2", datei: "Lieber_Lautt-2.mp3", band: "bpp" },
            { titel: "Märchengast", datei: "Märchengast.mp3", band: "bpp" },
            { titel: "Verstecktes Dorf", datei: "Verstecktes_Dorf.mp3", band: "bpp" },
            { titel: "Wind in den Haaren", datei: "Wind-in_den_Haaren.mp3", band: "bpp" },
            { titel: "Wo sind die Wölfe", datei: "Wo_sind_die_Wölfe.mp3", band: "bpp" },
            { titel: "Zirkus von Pandoria", datei: "Zirkus_von_Pandoria.mp3", band: "bpp" }
        ];

        function saveFilterState() {
            const bppChecked = document.getElementById('chk-bpp').checked;
            const jsChecked = document.getElementById('chk-js').checked;
            localStorage.setItem('filter_bpp', bppChecked);
            localStorage.setItem('filter_js', jsChecked);
        }

        function loadFilterState() {
            const savedBpp = localStorage.getItem('filter_bpp');
            const savedJs = localStorage.getItem('filter_js');
            document.getElementById('chk-bpp').checked = (savedBpp === null) ? true : (savedBpp === 'true');
            document.getElementById('chk-js').checked = (savedJs === null) ? true : (savedJs === 'true');
        }

        function onFilterChange() {
            saveFilterState();
            renderJukebox();
        }

        function renderJukebox() {
            const container = document.getElementById('jukebox-playlist');
            const showBpp = document.getElementById('chk-bpp').checked;
            const showJs = document.getElementById('chk-js').checked;

            let html = '';
            
            const gefilterteSongs = songListe.filter(song => {
                if (song.band === 'bpp' && showBpp) return true;
                if (song.band === 'js' && showJs) return true;
                return false;
            });

            if (gefilterteSongs.length === 0) {
                html = '<p style="opacity: 0.6;">Keine Band ausgewählt.</p>';
            } else {
                gefilterteSongs.forEach(song => {
                    const saubererPfad = encodeURI(song.datei);
                    let bandLabel = (song.band === 'bpp') ? 'Baby Pink Panda' : 'Jorvik Sisters';

                    html += `
                        <div class="plan-entry">
                            <strong>🐱 ${song.titel} <span style="font-size:0.8em; opacity:0.7;">(${bandLabel})</span></strong><br>
                            <audio controls preload="none">
                                <source src="${saubererPfad}" type="audio/mpeg">
                            </audio>
                        </div>
                    `;
                });
            }
            
            container.innerHTML = html;
            setupJukebox();
        }

        function setupJukebox() {
            const audios = document.querySelectorAll('audio');
            audios.forEach(audio => {
                audio.addEventListener('play', () => {
                    audios.forEach(otherAudio => {
                        if (otherAudio !== audio) {
                            otherAudio.pause();
                        }
                    });
                });
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadFilterState();
            renderJukebox();
        });
    </script>
</body>
</html>
