<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Presidents Clubhouse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1160px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .column {
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2, h3 {
            color: #ff9900;
            margin-top: 0;
        }
        .plan-entry {
            background-color: #333333;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #ff9900;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        audio {
            width: 100%;
            height: 35px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- CHAMPI BAROMETER -->
    <div class="column">
        <h2>🏆 Champi-Barometer</h2>
        <div id="barometerContent">
            <p>✅ Barometer ist aktiv!</p>
        </div>
    </div>

    <!-- CLUB-CHAT -->
    <div class="column">
        <h3>💬 Club-Chat</h3>
        <iframe src="https://minnit.chat/CatPresidents?embed&nickname=" width="100%" height="400" style="border:none; border-radius:8px;"></iframe>
    </div>

    <!-- CLUB-JUKEBOX -->
    <div class="column">
        <h3>🎵 Club-Jukebox</h3>
        <p style="font-size: 0.9em; opacity: 0.8;">Wähle einen Song aus und klicke auf Play:</p>

        <!-- SONG 1 -->
        <div class="plan-entry">
            <div>
                <strong>🐱 Lieber Lautt 2</strong>
            </div>
            <audio controls preload="none">
                <source src="Lieber_Lautt-2.mp3" type="audio/mpeg">
                Dein Browser unterstützt diesen Player nicht.
            </audio>
        </div>

        <!-- SONG 2 -->
        <div class="plan-entry">
            <div>
                <strong>🐱 Drachenhexe</strong>
            </div>
            <audio controls preload="none">
                <source src="Drachenhexe.mp3" type="audio/mpeg">
                Dein Browser unterstützt diesen Player nicht.
            </audio>
        </div>

        <!-- SONG 3 -->
        <div class="plan-entry">
            <div>
                <strong>🐱 Märchengast</strong>
            </div>
            <audio controls preload="none">
                <source src="Märchengast.mp3" type="audio/mpeg">
                Dein Browser unterstützt diesen Player nicht.
            </audio>
        </div>

        <!-- SONG 4 -->
        <div class="plan-entry">
            <div>
                <strong>🐱 Verstecktes Dorf</strong>
            </div>
            <audio controls preload="none">
                <source src="Verstecktes_Dorf.mp3" type="audio/mpeg">
                Dein Browser unterstützt diesen Player nicht.
            </audio>
        </div>

    </div>

</div>

</body>
</html>
