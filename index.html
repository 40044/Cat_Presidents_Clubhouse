<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kDrive Audio Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 40px;
            text-align: center;
        }
        .test-box {
            background-color: #2a2a2a;
            border-radius: 12px;

            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #ff9900;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="test-box">

        <!-- Test-Player mit deinem Original kDrive Share-Link -->
        <audio controls preload="none">
