<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie - Cat Presidents Clubhouse 🐱</title>
    <link rel="stylesheet" href="style.css">
    <script src="galerie.js" defer></script>
</head>
<body>

    <header class="header">
        <a href="index.html" class="btn-pink back-btn">⬅️ Zurück zur Hauptseite</a>
        <h1 class="logo-text">🖼️ Katzen-Galerie 🐾</h1>
    </header>

    <main class="gallery-container">
        <h3>Alle Club-Katzen</h3>
        <div id="cat-gallery" class="gallery-grid"></div>
    </main>

    <!-- Modal für Großansicht -->
    <div id="imageModal" class="modal">
        <span id="closeBtn" class="close-btn">&times;</span>
        <span id="prevBtn" class="modal-nav-btn prev-btn">&#10094;</span>
        <img id="modalImg" src="" alt="Großansicht Katzenbild">
        <span id="nextBtn" class="modal-nav-btn next-btn">&#10095;</span>
    </div>

</body>
</html>
